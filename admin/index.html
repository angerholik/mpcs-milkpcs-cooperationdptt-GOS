<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Milk PCS Admin — Department of Cooperation, Sikkim</title>
    <meta name="description" content="Restricted admin dashboard for reviewing Milk PCS submissions across Sikkim's cooperative centers." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
    <!-- Outfit + DM Sans: mobile-only UI (admin/src/mobile) borrows the
         field-officer app's typography, separate from the desktop's Inter/Cinzel. -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Boot splash: rendered from static HTML/CSS so it's on screen the
         instant the page paints, before the JS bundle has even finished
         downloading — otherwise this moment is a blank white flash. Kept
         mounted through React's own session-check loading state (see
         App.jsx's removal effect) so there's one continuous branded
         screen from first paint to the real UI, not splash → blank →
         spinner → content. -->
    <style>
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #47050C;
        transition: opacity .4s ease;
      }
      #boot-splash.boot-splash-hide { opacity: 0; pointer-events: none; }
      #boot-splash img {
        width: 64px; height: 64px; object-fit: contain;
        filter: brightness(0) invert(1); opacity: .85; margin-bottom: 16px;
      }
      #boot-splash .boot-splash-word {
        font-family: 'Cinzel', serif; font-size: 30px; font-weight: 700;
        color: #FFFFFF; letter-spacing: 6px;
      }
      #boot-splash .boot-splash-spin {
        margin-top: 26px; width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,.25); border-top-color: #E3B94F;
        animation: boot-splash-spin .8s linear infinite;
      }
      @keyframes boot-splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash">
      <img src="/sikkim-emblem.png" alt="" />
      <div class="boot-splash-word">CORE</div>
      <div class="boot-splash-spin"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
