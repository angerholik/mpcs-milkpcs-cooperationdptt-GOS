<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, shrink-to-fit=no" />
    <title>Milk PCS Reporting</title>

    <meta name="theme-color" content="#7C1C1C" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.png" />

    <!-- iOS "Add to Home Screen": launches full-screen with no Safari
         chrome, its own icon, and its own app-switcher entry — the
         standalone-app behavior instead of a browser tab every time. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CORE" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* 100dvh tracks the real visible viewport on iOS Safari, so the
           page doesn't stay sized to the smaller on-screen-keyboard height
           after the keyboard closes (the classic "shifted up, blank gap
           at the bottom" bug). Falls back to 100% on browsers that don't
           support dvh yet. */
        height: 100dvh;
        /* The viewport meta's user-scalable=no (below) no longer actually
           blocks pinch-zoom — Chrome (76+) and Safari both deliberately
           ignore that restriction now, as a deliberate accessibility
           decision, regardless of what the page declares. touch-action is
           the only thing that still works: listing just pan-x/pan-y (and
           omitting pinch-zoom) disables the pinch gesture at the CSS level
           while leaving normal scrolling/panning untouched. Without this,
           a stray pinch anywhere in the app zooms the whole page in with
           no way back except this fix, leaving the layout looking "pushed
           out of place" until the page is reloaded. */
        touch-action: pan-x pan-y;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }

      /* Chrome/Safari render an autofilled <input>'s value with an internal
         UA font/background until the field is focused or edited, at which
         point the page's own styling (font, size, color) finally applies —
         seen on the CORE login screen as email/password text visibly
         "growing" the moment the field is clicked. Forcing font + color
         back to the app's own values (and neutralizing the autofill
         background-color flash) makes autofilled text render correctly
         from the first paint instead of only after interaction. */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        font-size: 15px !important;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
        -webkit-text-fill-color: #26384F !important;
        transition: background-color 9999s ease-in-out 0s;
      }

      /* Boot splash: rendered from static HTML/CSS so it's on screen the
         instant the page paints, before the JS bundle has even finished
         downloading — otherwise this moment is a blank white flash. Kept
         mounted through the RN app's own auth-check loading state (see
         App.js's removal effect) so there's one continuous branded screen
         from first paint to the real UI, not splash → blank → spinner →
         content. Native iOS/Android builds use app.json's own splash
         config instead — this only renders for the web/PWA build. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #7C1C1C;
        transition: opacity .4s ease;
      }
      #boot-splash.boot-splash-hide { opacity: 0; pointer-events: none; }
      #boot-splash img {
        width: 60px; height: 60px; object-fit: contain;
        filter: brightness(0) invert(1); opacity: .85; margin-bottom: 16px;
      }
      #boot-splash .boot-splash-word {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 22px; font-weight: 800; color: #FFFFFF; letter-spacing: 4px;
      }
      #boot-splash .boot-splash-spin {
        margin-top: 24px; width: 20px; height: 20px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,.25); border-top-color: #FDE68A;
        animation: boot-splash-spin .8s linear infinite;
      }
      @keyframes boot-splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="boot-splash">
      <img src="/sikkim-emblem.png" alt="" />
      <div class="boot-splash-word">CORE</div>
      <div class="boot-splash-spin"></div>
    </div>
  </body>
</html>
